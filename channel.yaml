kind: channel
version: 1
id: gitlab
name: GitLab

required_env: [GITLAB_TRIGGER_TOKEN, GITLAB_WEBHOOK_SIGNING_TOKEN, GITLAB_API_URL, GITLAB_BOT_USERNAME, GITLAB_TRIGGER_PHRASE]

inbound:
  http_webhook:
    path: /webhook/gitlab
    signature_scheme: "standard_webhooks"
    signature_secret: "{{env.GITLAB_WEBHOOK_SIGNING_TOKEN}}"

  event_path: ""

  process_when:
    - field: object_attributes.note
      contains: "{{env.GITLAB_TRIGGER_PHRASE}}"

  dedup:
    key: "{{event.object_attributes.id}}"
    ttl: 5m

  dispatch:
    when:
      - field: object_attributes.note
        contains: "{{env.GITLAB_TRIGGER_PHRASE}}"
    skip:
      - field: object_attributes.system
        equals: "true"
      # The bot's own replies (usage text, confirmations) often contain
      # the trigger phrase themselves — without this, they re-trigger a
      # pipeline against their own post. See
      # docs/design.md, "Why dispatch.skip also excludes the relay's own
      # GitLab username".
      - field: user.username
        equals: "{{env.GITLAB_BOT_USERNAME}}"
    call:
      method: POST
      url: "{{env.GITLAB_API_URL}}/projects/{{event.project.id}}/trigger/pipeline?token={{env.GITLAB_TRIGGER_TOKEN}}&ref={{event.merge_request.source_branch}}"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "variables[REVIEW_MR_IID]={{event.merge_request.iid}}&variables[REVIEW_NOTE_ID]={{event.object_attributes.id}}"

  mapping:
    conversation_id: "project.id"
    sender_id: "user.username"
    content: "object_attributes.note"
    thread_id: "merge_request.iid"
